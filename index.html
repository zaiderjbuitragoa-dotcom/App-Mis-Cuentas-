<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Dinero">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<title>Mi Dinero</title>
</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>
  <nav id="nav" aria-label="Principal">
    <button data-act="tab" data-tab="inicio"><span>◉</span>Inicio</button>
    <button data-act="tab" data-tab="movs"><span>≡</span>Movimientos</button>
    <button class="fab" data-act="nuevo" aria-label="Nuevo movimiento">+</button>
    <button data-act="tab" data-tab="cuentas"><span>▣</span>Cuentas</button>
    <button data-act="tab" data-tab="ajustes"><span>⚙</span>Ajustes</button>
  </nav>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="lock" class="lock" hidden></div>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
